
spring.application.name=library-management

# Local file-based H2 database: persists across restarts in ./data/librarydb.mv.db
# (path is relative to the folder you start the app from, i.e. the project root)
spring.datasource.url=jdbc:h2:file:./data/librarydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Time zone used to decide which calendar day a book is due / returned (fine = overdue calendar days x rate)
library.timezone=Asia/Kolkata
