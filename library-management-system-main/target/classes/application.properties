spring.application.name=library-management

# MySQL database (create it once: CREATE DATABASE library_management ...; see README)
# Credentials come from environment variables - never hardcode the password here.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" only adds missing tables/columns; it never drops or empties existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Time zone used to decide which calendar day a book is due / returned (fine = overdue calendar days x rate)
library.timezone=Asia/Kolkata
